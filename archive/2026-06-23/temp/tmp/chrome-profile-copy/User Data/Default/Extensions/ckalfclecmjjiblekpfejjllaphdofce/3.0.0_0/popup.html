<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/libs/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/libs/bootstrap.min.css">
    <link rel="stylesheet" href="/css/popup.min.css" />

    <title data-loc="AppName"></title>
</head>

<body>
    <div class="grp-apps btn-group w-100 mb-3">
        <a target="_blank" class="btn btn-warning teaser">
            <img class="h-1" src="img/rate.png" />
            <span data-loc="RateUs"></span>
        </a>
        <a target="_blank" class="btn btn-success" href="https://qr-code-scanner.dllplayer.com/">
            <img class="h-1" src="img/share.png" />
            <span data-loc="Share"></span>
        </a>
    </div>

    <main-app class="px-3">
        <link class="lnk-qr-worker" rel="preload" as="script" href="/libs/qr-scanner/qr-scanner-worker.min.js" />

        <div class="preview mb-3">
            <div class="d-none img-preview"></div>
            <video class="d-none video-preview"></video>
        </div>

        <div class="btn-group w-100 mb-3">
            <button class="btn btn-outline-primary btn-camera" disabled>
                <i class="fa-solid fa-video"></i>
                <span data-loc="Camera"></span>
            </button>
            <button class="btn btn-outline-primary btn-image">
                <i class="fa-regular fa-image"></i>
                <span data-loc="Image"></span>
            </button>
            <button class="btn btn-outline-primary btn-tab">
                <i class="fa-regular fa-window-restore"></i>
                <span data-loc="Tab"></span>
            </button>
        </div>

        <div class="list-group list-result">
            <div class="list-group-item">
                <span data-loc="DefaultText"></span>
            </div>
            <template class="template-item">
                <div class="list-group-item">
                    <div class="input-group">
                        <input disabled class="form-control txt-content" />
                        <a target="_blank" class="btn btn-outline-primary btn-open">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <span data-loc="Open"></span>
                        </a>
                        <button class="btn btn-outline-primary btn-copy">
                            <i class="fa-regular fa-copy"></i>
                            <span data-loc="Copy"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </main-app>

    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/popup.js"></script>
    <script type="module" src="js/rate.js"></script>
</body>

</html>
